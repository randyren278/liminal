[workspace]
resolver = "2"
members = [
    "crates/liminal-schema",
    "crates/liminal-policy",
    "crates/liminal-ledger",
    "crates/liminal-memory",
    "crates/liminal-ipc",
    "crates/liminal-cli",
    "crates/liminal-tui",
    "crates/liminald",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
blake3 = "1"
hmac = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
