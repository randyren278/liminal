# full-reign CI -- Rust + Swift. The mutation guard is meaningless unless
# the unmutated suite is already green, so it is gated on `deterministic`.
# `swift` is independent of both -- it covers app/Liminal, which has no
# mutation manifest of its own (its hardware probes aren't testable in CI;
# only the JSON-schema and hashing logic under LiminalCore is).
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Tests, coverage, docs
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Rust
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the suite with coverage
        run: cargo llvm-cov --workspace --lcov --output-path target/lcov.info

      - name: Per-module floor for critical modules
        run: >-
          python3 checks/coverage_gate.py
          --manifest checks/mutations.json --report target/lcov.info

      - name: Documentation gate
        run: |
          python3 checks/docs_gate.py --root . README.md
          python3 checks/docs_gate.py --root . --min-diagrams 1 docs/ARCHITECTURE.md

      - name: Mutation harness tests
        run: >-
          python3 -m unittest
          checks/test_mutation_guard.py
          checks/test_liminal_supervisor.py
          -v

  mutation:
    name: Mutation guard (${{ matrix.scope }})
    needs: deterministic
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: schema
            prefix: crates/liminal-schema/
            shard: ""
            minimum: 2
          - scope: policy
            prefix: crates/liminal-policy/
            shard: ""
            minimum: 4
          - scope: ledger
            prefix: crates/liminal-ledger/
            shard: ""
            minimum: 7
          - scope: memory
            prefix: crates/liminal-memory/
            shard: ""
            minimum: 1
          - scope: daemon-a
            prefix: crates/liminald/
            shard: --shard 1/2
            minimum: 4
          - scope: daemon-b
            prefix: crates/liminald/
            shard: --shard 2/2
            minimum: 4
          - scope: tui-a
            prefix: crates/liminal-tui/
            shard: --shard 1/2
            minimum: 7
          - scope: tui-b
            prefix: crates/liminal-tui/
            shard: --shard 2/2
            minimum: 7
          - scope: cli
            prefix: crates/liminal-cli/
            shard: ""
            minimum: 7
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Each isolated runner re-proves the full baseline and its scoped suite,
      # then breaks every invariant in one owning crate.
      - name: Break each invariant and require the suite to catch it
        run: >-
          python3 checks/mutation_guard.py
          --manifest checks/mutations.json
          --file-prefix ${{ matrix.prefix }}
          ${{ matrix.shard }}
          --assert-min ${{ matrix.minimum }}
          --report mutation-report-${{ matrix.scope }}.json

      - name: Upload mutation verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.scope }}
          path: mutation-report-${{ matrix.scope }}.json
          if-no-files-found: warn

  mutation-verdict:
    name: Mutation guard (exact 43-mutant verdict)
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: mutation-report-*
          path: mutation-reports
          merge-multiple: true

      # This rejects missing, duplicate, unknown, survived, stale, and timed-out
      # results. Sharding never weakens the 43-mutant quality ratchet.
      - name: Require exact exhaustive mutation coverage
        run: >-
          python3 checks/verify_mutation_reports.py
          --manifest checks/mutations.json
          mutation-reports/*.json

  swift:
    name: Swift build + test (LiminalCore, liminal-doctor)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/Liminal
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: app/Liminal/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('app/Liminal/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Install swiftformat
        run: brew install swiftformat

      - name: Format check
        run: swiftformat --lint .

      - name: Build
        run: swift build

      - name: Test
        run: swift test
